{% extends "notes/base.html" %}
{% block title %}New folder{% endblock %}
{% block main %}
  <div class="crumb"><a href="{% url 'home' %}">Home</a><span class="sep">/</span><span class="here">New folder</span></div>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  <h2 class="page-title" style="margin-bottom:18px">New folder</h2>
  <form method="post" style="max-width:520px">{% csrf_token %}
    <div class="field"><label>Name</label>{{ form.name }}</div>
    <div class="field"><label>Parent <span class="hint">blank = top level (admins only)</span></label>{{ form.parent }}</div>
    <div class="field"><label>Visibility</label>{{ form.visibility }}</div>
    <div class="save-row">
      <button class="btn primary" type="submit">Create folder</button>
      <a class="btn" href="{% url 'home' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
{% block rail %}{% endblock %}
