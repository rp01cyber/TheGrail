<div class="toolbar">
  <button class="tb" data-act="bold" title="Bold">B</button>
  <button class="tb" data-act="italic" title="Italic" style="font-style:italic">I</button>
  <button class="tb mono" data-act="code" title="Inline code">&lt;/&gt;</button>
  <span class="tb-sep"></span>
  <button class="tb" data-act="h2" title="Heading">H2</button>
  <button class="tb" data-act="h3" title="Subheading">H3</button>
  <span class="tb-sep"></span>
  <button class="tb" data-act="ul" title="Bullet list">&bull;</button>
  <button class="tb" data-act="ol" title="Numbered list">1.</button>
  <button class="tb" data-act="quote" title="Quote">&rdquo;</button>
  <span class="tb-sep"></span>
  <button class="tb mono" data-act="codeblock" title="Code block">{ }</button>
  <button class="tb" data-act="link" title="Link">&#128279;</button>
  <button class="tb" data-act="table" title="Table">&#9638;</button>
  <span class="tb-sep"></span>
  <div style="position:relative;display:inline-block">
    <button class="tb" data-color-btn title="Text color" style="font-weight:700">A<span style="display:block;height:3px;background:linear-gradient(90deg,#E51AFF,#00B826,#FF8800);margin-top:-2px;border-radius:2px"></span></button>
    <div class="color-pop">
      <span class="swatch" data-color="000000" style="background:#000000" title="Black"></span>
      <span class="swatch" data-color="E51AFF" style="background:#E51AFF" title="#E51AFF"></span>
      <span class="swatch" data-color="0C00A1" style="background:#0C00A1" title="#0C00A1"></span>
      <span class="swatch" data-color="00B826" style="background:#00B826" title="#00B826"></span>
      <span class="swatch" data-color="FFFD00" style="background:#FFFD00" title="#FFFD00"></span>
      <span class="swatch" data-color="FF8800" style="background:#FF8800" title="#FF8800"></span>
      <span class="swatch" data-color="BF0000" style="background:#BF0000" title="#BF0000"></span>
    </div>
  </div>
  <span class="tb-spacer"></span>
  <button class="tb tb-preview" title="Toggle preview">Preview</button>
</div>
