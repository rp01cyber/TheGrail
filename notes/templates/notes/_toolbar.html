<div class="toolbar">
  <button class="tb" data-act="bold" title="Bold">B</button>
  <button class="tb" data-act="italic" title="Italic" style="font-style:italic">I</button>
  <button class="tb mono" data-act="code" title="Inline code">&lt;/&gt;</button>
  <span class="tb-sep"></span>
  <button class="tb" data-act="h2" title="Heading">H2</button>
  <button class="tb" data-act="h3" title="Subheading">H3</button>
  <span class="tb-sep"></span>
  <button class="tb" data-act="ul" title="Bullet list">•</button>
  <button class="tb" data-act="ol" title="Numbered list">1.</button>
  <button class="tb" data-act="quote" title="Quote">&rdquo;</button>
  <span class="tb-sep"></span>
  <button class="tb mono" data-act="codeblock" title="Code block">{ }</button>
  <button class="tb" data-act="link" title="Link">🔗</button>
  <button class="tb" data-act="table" title="Table">▦</button>
  <span class="tb-spacer"></span>
  <button class="tb tb-preview" title="Toggle preview">Preview</button>
</div>
