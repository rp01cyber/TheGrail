{% extends "notes/base.html" %}
{% block title %}Log in — PentestNotes{% endblock %}
{% block main %}
  <div class="login-wrap">
    <h2>Log in</h2>
    <form method="post">{% csrf_token %}
      <label>Username</label>{{ form.username }}
      <label>Password</label>{{ form.password }}
      {% if form.errors %}<div class="err">That username and password didn’t match. Try again.</div>{% endif %}
      <button type="submit">Log in</button>
    </form>
  </div>
{% endblock %}
{% block rail %}{% endblock %}
